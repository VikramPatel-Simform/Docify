# Docker
# Build a Docker image
# https://docs.microsoft.com/azure/devops/pipelines/languages/docker

trigger:
- master

resources:
- repo: self

variables:
  tag: '$(Build.BuildId)'

pool: Custom-Pool
stages:
- stage: Build
  displayName: Build image
  jobs:
  - job: Build
    displayName: Build
    steps:
    - task: Docker@2
      inputs:
        containerRegistry: 'docify'
        repository: 'server'
        command: 'buildAndPush'
        Dockerfile: 'server/Dockerfile'
    - task: Docker@2
      inputs:
        containerRegistry: 'docify'
        repository: 'client'
        command: 'buildAndPush'
        Dockerfile: 'client/Dockerfile'
    - task: Docker@2
      inputs:
        containerRegistry: 'docify'
        repository: 'auth'
        command: 'buildAndPush'
        Dockerfile: 'auth/Dockerfile'
        
    
